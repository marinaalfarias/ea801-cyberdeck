# arquivo de configuração centrao do PlatformIO para ESP32

[env:esp32-s3-devkitc-1]           ; ESP32-S3 DevKit C1
platform = espressif32              ; plataforma (família do chip)
board = esp32-s3-devkitc-1         ; placa específica
framework = arduino                 ; framework de desenvolvimento
monitor_speed = 115200              ; baud rate do monitor serial
upload_speed = 921600               ; velocidade de gravação

lib_deps =                          ; lista de bibliotecas externas
    adafruit/Adafruit GFX Library
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
    adafruit/Adafruit ST7735 and ST7789 Library